<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#140b29" />
      <stop offset="100%" stop-color="#06040a" />
    </radialGradient>
    
    <!-- Neon Purple Gradient -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b55fe6" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonPurple)" stroke-width="6" opacity="0.3" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-dasharray="100 40 20 40" filter="url(#glow)" />

  <!-- Inner Rings / Neural Paths -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonPurple)" stroke-width="2" stroke-dasharray="5 10" opacity="0.5" />

  <!-- Central Brain / Network Node Design -->
  <g filter="url(#glow)">
    <!-- Connections -->
    <path d="M 256 120 L 170 210 M 256 120 L 342 210 M 170 210 L 190 320 M 342 210 L 322 320 M 190 320 L 256 390 M 322 320 L 256 390 M 170 210 L 256 256 M 342 210 L 256 256 M 190 320 L 256 256 M 322 320 L 256 256 M 256 120 L 256 256 M 256 390 L 256 256" stroke="url(#neonPurple)" stroke-width="2" opacity="0.6" />
    
    <!-- Nodes -->
    <circle cx="256" cy="120" r="12" fill="url(#neonCyan)" />
    <circle cx="170" cy="210" r="10" fill="url(#neonPurple)" />
    <circle cx="342" cy="210" r="10" fill="url(#neonPurple)" />
    <circle cx="190" cy="320" r="10" fill="url(#neonCyan)" />
    <circle cx="322" cy="320" r="10" fill="url(#neonCyan)" />
    <circle cx="256" cy="390" r="12" fill="url(#neonPurple)" />
    <circle cx="256" cy="256" r="20" fill="url(#neonCyan)" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Glowing Core Letter J -->
  <text x="256" y="278" font-family="'Sora', sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">J</text>
</svg>
